<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Monopoly GO - Tabla de Carreras</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:#f3f4f8;
    color:#202124;
    padding:16px 10px 30px;
  }
  .app{max-width:720px;margin:auto}
  h1{font-size:24px;margin:4px 0 4px;text-align:center}
  .sub{text-align:center;color:#666;font-size:13px;margin-bottom:18px}
  .card{
    background:white;border-radius:16px;padding:14px;margin-bottom:14px;
    box-shadow:0 2px 10px rgba(0,0,0,.07);overflow:hidden
  }
  .card h2{font-size:17px;margin:0 0 10px}
  table{width:100%;border-collapse:collapse}
  th,td{padding:8px 5px;text-align:center;border-bottom:1px solid #eee;font-size:13px}
  th{font-weight:700;background:#fafafa}
  .place{font-weight:700;width:48px}
  select{
    width:100%;min-width:88px;padding:8px 5px;border:1px solid #d5d7dc;
    border-radius:9px;background:white;font-size:13px
  }
  .points{font-weight:700;width:45px}
  .total-table td,.total-table th{padding:10px 6px}
  .rank{font-weight:800;width:45px}
  .team{font-weight:700;text-align:left}
  .score{font-weight:800;font-size:16px}
  .first{font-weight:800}
  .note{font-size:12px;color:#666;line-height:1.45;margin-top:10px}
  button{
    width:100%;border:0;border-radius:11px;padding:11px;margin-top:10px;
    font-size:14px;font-weight:700;background:#eceef3;cursor:pointer
  }
  .danger{background:#fff0f0;color:#b42318}
  @media(max-width:430px){
    body{padding:10px 7px 25px}
    .card{padding:11px;border-radius:14px}
    h1{font-size:21px}
    th,td{font-size:12px;padding:7px 3px}
    select{min-width:0;padding:8px 2px;font-size:12px}
  }
</style>
</head>
<body>
<div class="app">
  <h1>🏁 Carrera Monopoly GO</h1>
  <div class="sub">Ingresa quién quedó en cada lugar y el puntaje se calcula automáticamente.</div>

  <div class="card">
    <h2>Resultados por ronda</h2>
    <table>
      <thead>
        <tr>
          <th>Lugar</th>
          <th>Ronda 1</th><th>#</th>
          <th>Ronda 2</th><th>#</th>
          <th>Ronda 3</th><th>#</th>
        </tr>
      </thead>
      <tbody id="rounds"></tbody>
    </table>
    <div class="note">
      Rondas 1 y 2: 🥇 10 · 🥈 8 · 🥉 5 · 4.º 3<br>
      Ronda 3: 🥇 20 · 🥈 16 · 🥉 10 · 4.º 6
    </div>
  </div>

  <div class="card">
    <h2>🏆 Clasificación final</h2>
    <table class="total-table">
      <thead><tr><th>Lugar</th><th style="text-align:left">Team</th><th>Puntaje total</th></tr></thead>
      <tbody id="ranking"></tbody>
    </table>
  </div>

  <button onclick="resetGame()">Reiniciar resultados</button>
</div>

<script>
const teams = ["Rosado","Morado","Amarillo","Rojo"];
const places = ["1st","2nd","3rd","4th"];
const scores = [
  [10,8,5,3],
  [10,8,5,3],
  [20,16,10,6]
];

const saved = JSON.parse(localStorage.getItem("monopolyRace") || "null");
const data = saved || [
  ["Rosado","Morado","Amarillo","Rojo"],
  ["Amarillo","Rosado","Morado","Rojo"],
  ["Amarillo","Rosado","Morado","Rojo"]
];

function makeSelect(round, place){
  const s=document.createElement("select");
  teams.forEach(team=>{
    const o=document.createElement("option");
    o.value=team;o.textContent=team;
    if(data[round][place]===team)o.selected=true;
    s.appendChild(o);
  });
  s.addEventListener("change",()=>{
    data[round][place]=s.value;
    save();
    renderRanking();
  });
  return s;
}

function renderRounds(){
  const tbody=document.getElementById("rounds");
  tbody.innerHTML="";
  for(let p=0;p<4;p++){
    const tr=document.createElement("tr");
    const td=document.createElement("td");
    td.className="place";td.textContent=places[p];tr.appendChild(td);
    for(let r=0;r<3;r++){
      const tdTeam=document.createElement("td");
      tdTeam.appendChild(makeSelect(r,p));tr.appendChild(tdTeam);
      const tdScore=document.createElement("td");
      tdScore.className="points";tdScore.textContent=scores[r][p];tr.appendChild(tdScore);
    }
    tbody.appendChild(tr);
  }
}

function getTotals(){
  const totals={};
  teams.forEach(t=>totals[t]=0);
  for(let r=0;r<3;r++){
    for(let p=0;p<4;p++) totals[data[r][p]]+=scores[r][p];
  }
  return totals;
}

function renderRanking(){
  const totals=getTotals();
  const sorted=Object.entries(totals).sort((a,b)=>b[1]-a[1]);
  const tbody=document.getElementById("ranking");
  tbody.innerHTML="";
  sorted.forEach(([team,total],i)=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`<td class="rank">${places[i]}</td><td class="team">${team}</td><td class="score">${total}</td>`;
    if(i===0)tr.classList.add("first");
    tbody.appendChild(tr);
  });
}

function save(){localStorage.setItem("monopolyRace",JSON.stringify(data));}
function resetGame(){
  if(confirm("¿Quieres borrar los resultados y empezar de nuevo?")){
    localStorage.removeItem("monopolyRace");
    location.reload();
  }
}

renderRounds();
renderRanking();
</script>
</body>
</html>
