<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Monopoly GO - Carrera</title>

<style>

*{
  box-sizing:border-box;
}

:root{
  --monopoly-red:#ed1c24;
  --monopoly-dark:#171717;
  --monopoly-gold:#f5c542;
  --bg:#f4f1e8;

  /* Colores de los equipos */
  --team-red:#e53935;
  --team-blue:#1976d2;
  --team-yellow:#fbc02d;
  --team-green:#43a047;
}

body{
  margin:0;
  padding:10px 8px 25px;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--monopoly-dark);
}

.app{
  width:100%;
  max-width:500px;
  margin:auto;
}

/* =========================
   ENCABEZADO
========================= */

.header{
  background:var(--monopoly-red);
  color:white;
  border:4px solid var(--monopoly-dark);
  border-radius:12px;
  padding:13px 12px;
  text-align:center;
  box-shadow:4px 4px 0 var(--monopoly-dark);
  margin-bottom:14px;
}

.logo{
  font-size:28px;
  line-height:1;
  margin-bottom:4px;
}

h1{
  margin:0;
  font-size:21px;
  font-weight:900;
  letter-spacing:.2px;
}

.subtitle{
  font-size:11px;
  margin-top:5px;
  opacity:.95;
}

/* =========================
   TARJETAS
========================= */

.card{
  background:white;
  border:2px solid var(--monopoly-dark);
  border-radius:12px;
  padding:11px;
  margin-bottom:12px;
  box-shadow:3px 3px 0 rgba(0,0,0,.18);
}

.title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:9px;
}

.title h2{
  margin:0;
  font-size:16px;
  font-weight:900;
}

.badge{
  background:var(--monopoly-gold);
  color:#171717;
  border:1.5px solid #171717;
  border-radius:7px;
  padding:3px 7px;
  font-size:9px;
  font-weight:900;
}

/* =========================
   RONDAS
========================= */

.round{
  border:1.5px solid #d8d4c8;
  border-radius:9px;
  padding:8px;
  margin-bottom:8px;
  background:#faf9f4;
}

.round:last-child{
  margin-bottom:0;
}

.round-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:6px;
}

.round-name{
  font-size:13px;
  font-weight:900;
}

.round-points{
  font-size:9px;
  font-weight:700;
  color:#666;
}

/* =========================
   FILAS
========================= */

.position{
  display:grid;
  grid-template-columns:40px minmax(0,1fr) 38px;
  align-items:center;
  gap:7px;

  background:white;
  border:1px solid #e5e2d9;
  border-radius:8px;

  padding:5px;
  margin-top:5px;

  min-height:42px;
}

.place{
  font-size:11px;
  font-weight:900;
  text-align:center;
}

/* =========================
   SELECTOR SOLO COLOR
========================= */

.color-select{
  width:100%;
  height:30px;
  border:2px solid #222;
  border-radius:7px;

  /* Oculta el texto */
  color:transparent;
  font-size:0;

  cursor:pointer;
  padding:0;

  appearance:none;
  -webkit-appearance:none;
}

/* Cada color */

.color-red{
  background:var(--team-red);
}

.color-blue{
  background:var(--team-blue);
}

.color-yellow{
  background:var(--team-yellow);
}

.color-green{
  background:var(--team-green);
}

.color-empty{
  background:#f0eee8;
  border:2px dashed #aaa;
}

/*
  Para poder seleccionar los colores,
  el menú conserva las opciones pero
  el campo visible solo muestra el color.
*/

.color-select option{
  color:#111;
  font-size:13px;
  background:white;
}

/* =========================
   PUNTAJE
========================= */

.points{
  background:var(--monopoly-dark);
  color:white;
  border-radius:7px;
  text-align:center;
  padding:7px 2px;
  font-size:11px;
  font-weight:900;
}

/* =========================
   LEYENDA
========================= */

.legend{
  display:flex;
  justify-content:center;
  gap:12px;
  margin-top:9px;
}

.legend-color{
  width:15px;
  height:15px;
  border-radius:4px;
  border:1.5px solid #222;
}

.legend-item{
  display:flex;
  align-items:center;
}

/* =========================
   CLASIFICACIÓN
========================= */

.ranking{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.rank{
  display:grid;
  grid-template-columns:32px 22px minmax(0,1fr) 48px;
  align-items:center;
  gap:6px;

  min-height:42px;
  padding:5px 7px;

  background:#faf9f4;
  border:1px solid #dedbd2;
  border-radius:8px;
}

.rank:first-child{
  background:#fff7d6;
  border:2px solid var(--monopoly-gold);
}

.rank-number{
  font-weight:900;
  text-align:center;
  font-size:13px;
}

.rank-color{
  width:18px;
  height:18px;
  border-radius:4px;
  border:1.5px solid #222;
}

.rank-name{
  font-size:12px;
  font-weight:900;
}

.rank-score{
  font-size:16px;
  font-weight:900;
  text-align:right;
}

.rank-score small{
  display:block;
  font-size:7px;
  color:#777;
}

/* =========================
   BOTÓN
========================= */

.reset{
  width:100%;
  border:2px solid var(--monopoly-dark);
  border-radius:9px;

  background:white;
  color:var(--monopoly-red);

  padding:10px;
  font-size:12px;
  font-weight:900;

  box-shadow:3px 3px 0 var(--monopoly-dark);
  cursor:pointer;
}

.reset:active{
  transform:translate(2px,2px);
  box-shadow:1px 1px 0 var(--monopoly-dark);
}

/* =========================
   MÓVILES MUY PEQUEÑOS
========================= */

@media(max-width:350px){

  body{
    padding:7px 5px 20px;
  }

  .header{
    padding:11px 8px;
  }

  h1{
    font-size:19px;
  }

  .card{
    padding:9px;
  }

  .position{
    grid-template-columns:36px minmax(0,1fr) 35px;
    gap:5px;
  }

  .round{
    padding:7px;
  }

  .legend{
    gap:8px;
  }

}


/* =========================
   COLORES PARA RANKING
========================= */

.red{
  background:var(--team-red);
}

.blue{
  background:var(--team-blue);
}

.yellow{
  background:var(--team-yellow);
}

.green{
  background:var(--team-green);
}

</style>
</head>

<body>

<div class="app">

  <!-- ENCABEZADO -->

  <div class="header">

    <div class="logo">🎩</div>

    <h1>CARRERA MONOPOLY GO</h1>

    <div class="subtitle">
      Selecciona el color que ocupó cada posición
    </div>

  </div>


  <!-- RESULTADOS -->

  <div class="card">

    <div class="title">
      <h2>🏁 Resultados</h2>
      <div class="badge">PUNTOS</div>
    </div>


    <!-- RONDA 1 -->

    <div class="round">

      <div class="round-header">

        <div class="round-name">
          Ronda 1
        </div>

        <div class="round-points">
          10 · 8 · 5 · 3
        </div>

      </div>

      <div id="round1"></div>

    </div>


    <!-- RONDA 2 -->

    <div class="round">

      <div class="round-header">

        <div class="round-name">
          Ronda 2
        </div>

        <div class="round-points">
          10 · 8 · 5 · 3
        </div>

      </div>

      <div id="round2"></div>

    </div>


    <!-- RONDA 3 -->

    <div class="round">

      <div class="round-header">

        <div class="round-name">
          Ronda 3
        </div>

        <div class="round-points">
          DOBLE · 20 · 16 · 10 · 6
        </div>

      </div>

      <div id="round3"></div>

    </div>


    <!-- LEYENDA -->

    <div class="legend">

      <div class="legend-item">
        <div class="legend-color red"></div>
      </div>

      <div class="legend-item">
        <div class="legend-color blue"></div>
      </div>

      <div class="legend-item">
        <div class="legend-color yellow"></div>
      </div>

      <div class="legend-item">
        <div class="legend-color green"></div>
      </div>

    </div>

  </div>


  <!-- CLASIFICACIÓN -->

  <div class="card">

    <div class="title">

      <h2>🏆 Clasificación</h2>

      <div class="badge">
        TOTAL
      </div>

    </div>

    <div id="ranking" class="ranking"></div>

  </div>


  <!-- REINICIAR -->

  <button class="reset" onclick="resetGame()">
    ↻ Reiniciar resultados
  </button>

</div>


<script>

/* =========================
   EQUIPOS
========================= */

const teams = [
  "Rojo",
  "Azul",
  "Amarillo",
  "Verde"
];


/* =========================
   POSICIONES
========================= */

const places = [
  "1.º",
  "2.º",
  "3.º",
  "4.º"
];


/* =========================
   PUNTAJES
========================= */

const scores = [
  [10,8,5,3],
  [10,8,5,3],
  [20,16,10,6]
];


/* =========================
   DATOS
========================= */

/*
  Importante:
  Si no existe información guardada,
  todas las posiciones comienzan vacías.
*/

const saved =
  JSON.parse(
    localStorage.getItem("monopolyRace") || "null"
  );


const data = saved || [
  ["","","",""],
  ["","","",""],
  ["","","",""]
];


/* =========================
   CLASE DE COLOR
========================= */

function colorClass(team){

  if(!team){
    return "color-empty";
  }

  return "color-" + team.toLowerCase();

}


/* =========================
   CREAR SELECTOR
========================= */

function makeSelect(round, place){

  const select =
    document.createElement("select");

  select.className =
    "color-select " +
    colorClass(data[round][place]);


  /*
    Primera opción vacía.
    Sirve para que al reiniciar
    no aparezca ningún carácter.
  */

  const empty =
    document.createElement("option");

  empty.value = "";
  empty.textContent = "";
  empty.selected =
    data[round][place] === "";

  select.appendChild(empty);


  teams.forEach(team => {

    const option =
      document.createElement("option");

    option.value = team;

    /*
      El texto existe internamente
      para que el selector funcione,
      pero el campo visible
      solamente muestra el color.
    */

    option.textContent = team;

    if(data[round][place] === team){
      option.selected = true;
    }

    select.appendChild(option);

  });


  select.addEventListener("change", () => {

    data[round][place] =
      select.value;

    select.className =
      "color-select " +
      colorClass(select.value);

    save();

    renderRanking();

  });


  return select;

}


/* =========================
   CREAR RONDA
========================= */

function renderRound(round){

  const container =
    document.getElementById(
      "round" + (round + 1)
    );

  container.innerHTML = "";


  for(let place = 0; place < 4; place++){

    const row =
      document.createElement("div");

    row.className = "position";


    /* POSICIÓN */

    const placeElement =
      document.createElement("div");

    placeElement.className = "place";

    placeElement.textContent =
      places[place];

    row.appendChild(placeElement);


    /* COLOR */

    row.appendChild(
      makeSelect(round,place)
    );


    /* PUNTOS */

    const points =
      document.createElement("div");

    points.className = "points";

    points.textContent =
      "+" + scores[round][place];

    row.appendChild(points);


    container.appendChild(row);

  }

}


/* =========================
   TOTALES
========================= */

function getTotals(){

  const totals = {};

  teams.forEach(team => {
    totals[team] = 0;
  });


  for(let round = 0; round < 3; round++){

    for(let place = 0; place < 4; place++){

      const team =
        data[round][place];

      /*
        Ignora las posiciones
        que todavía están vacías.
      */

      if(team){
        totals[team] +=
          scores[round][place];
      }

    }

  }

  return totals;

}


/* =========================
   RANKING
========================= */

function renderRanking(){

  const totals =
    getTotals();


  const sorted =
    Object.entries(totals)
      .sort((a,b) => {

        /*
          En caso de empate,
          conserva un orden estable.
        */

        if(b[1] !== a[1]){
          return b[1] - a[1];
        }

        return teams.indexOf(a[0])
             - teams.indexOf(b[0]);

      });


  const ranking =
    document.getElementById("ranking");

  ranking.innerHTML = "";


  sorted.forEach(([team,total],index) => {

    const row =
      document.createElement("div");

    row.className = "rank";


    /* POSICIÓN */

    const number =
      document.createElement("div");

    number.className =
      "rank-number";

    number.textContent =
      index + 1;


    /* COLOR */

    const color =
      document.createElement("div");

    color.className =
      "rank-color " +
      team.toLowerCase();


    /* NOMBRE */

    const name =
      document.createElement("div");

    name.className =
      "rank-name";

    name.textContent =
      team;


    /* PUNTAJE */

    const score =
      document.createElement("div");

    score.className =
      "rank-score";

    score.innerHTML =
      total +
      '<small>PTS</small>';


    row.appendChild(number);
    row.appendChild(color);
    row.appendChild(name);
    row.appendChild(score);


    ranking.appendChild(row);

  });

}


/* =========================
   GUARDAR
========================= */

function save(){

  localStorage.setItem(
    "monopolyRace",
    JSON.stringify(data)
  );

}


/* =========================
   REINICIAR
========================= */

function resetGame(){

  if(
    confirm(
      "¿Quieres borrar todos los resultados?"
    )
  ){

    /*
      Dejamos absolutamente
      todas las posiciones vacías.
    */

    for(let round = 0; round < 3; round++){

      for(let place = 0; place < 4; place++){

        data[round][place] = "";

      }

    }

    save();

    /*
      Volvemos a pintar los selectores
      completamente vacíos.
    */

    renderRound(0);
    renderRound(1);
    renderRound(2);

    renderRanking();

  }

}


/* =========================
   INICIO
========================= */

renderRound(0);
renderRound(1);
renderRound(2);

renderRanking();

</script>

</body>
</html>
